<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question - {{ exam.title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            margin: 0;
            padding: 35px;
            color: #1f2937;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        h1 {
            margin-top: 0;
        }

        .exam-title {
            color: #6b7280;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .errorlist {
            color: #dc2626;
            padding-left: 20px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .cancel {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .cancel {
            background: #e5e7eb;
            color: #1f2937;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Add MCQ Question</h1>
    <p class="exam-title">Examination: {{ exam.title }}</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="buttons">
            <button type="submit">Save Question</button>

            <a class="cancel"
               href="{% url 'questions:question_list' exam.id %}">
                Cancel
            </a>
        </div>
    </form>

</div>
</body>
</html>
