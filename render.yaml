services:
  - type: web
    name: online-exam-portal
    runtime: python
    branch: main
    rootDir: online-exam-portal-skeleton/online-exam-portal
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn oep.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    region: singapore
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: online-exam-portal-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: online-exam-portal
          envVarKey: RENDER_EXTERNAL_HOSTNAME

databases:
  - name: online-exam-portal-db
    databaseName: online_exam_portal
    user: online_exam_portal
    plan: free
    region: singapore
